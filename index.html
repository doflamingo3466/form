<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muhammad Abid</title>
</head>
<body>
    <section>
        <h1>Student Reg. Form</h1>
    <h2>Please Submit the form below</h2>
    <form method="post">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" placeholder="Enter your age" required><br><br>

        <label for="phone">Phone Number:</label>
        <input type="number" id="phone" name="phone number" placeholder="ENter your phone number" required><br><br>

        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other" required>
        <label for="other">Other</label><br><br>
        
        

        <label for="skill">Skills:</label><br>
        <input type="checkbox" id="html" name="skill" value="html">
        <label for="html">HTML</label>
        <input type="checkbox" id="css" name="skill" value="css">
        <label for="css">CSS</label>
        <input type="checkbox" id="js" name="skill" value="js">
        <label for="js">Js</label>
        <input type="checkbox" id="react" name="skill" value="react">
        <label for="react">REACT.Js</label><br><br>

        <label for="course">Course:</label>
        <select id="course" name="course" required>
            <option value="">select a course</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="react">REACT.Js</option>
            <option value="js">Js</option>
        </select><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" placeholder="Enter your message" rows="3" cols="40"></textarea><br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address" placeholder="Enter your address" rows="2" cols="30"></textarea><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
